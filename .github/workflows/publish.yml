name: Publish to npm

# Fires when the deploy script pushes a version tag (deploy-nexus-cortex.sh --release),
# or manually via the Actions tab. Publishes the engine packages to npm in dependency
# order. Idempotent: versions already on the registry are skipped, so re-runs and
# partial-failure recovery are safe. Release 2 (2026-08-06, operator go): the TUI
# (@nexus-cortex/tui) now publishes here too — after cli (it depends on cli+core),
# before meta.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — pack and validate, but do not publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Test gate — the same fresh-clone, no-API-key suite CI runs. `publish` needs this,
  # so a tag whose tests fail never reaches npm. (Cross-workflow `needs:` isn't possible
  # — CI is a separate workflow triggered by the main push, not the tag push — so the
  # gate is an in-workflow job here.)
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
      - name: Install deps
        run: |
          node -v && npm -v
          npm ci --no-audit --no-fund --ignore-scripts \
            || { echo "retry"; rm -rf node_modules packages/*/node_modules; npm ci --no-audit --no-fund --ignore-scripts; }
          test -x node_modules/.bin/tsc || { echo "::error::tsc not linked after install"; exit 1; }
      - run: node scripts/check-env-docs.mjs
      - run: npm run build
      - name: Tests (fresh-clone mode, no API keys)
        run: |
          for p in core executors server cli tui; do
            [ -d packages/$p ] || { echo "skip $p (not in this release)"; continue; }
            (cd packages/$p && npx vitest run --passWithNoTests)
          done

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Trusted publishing (2026-09-11): npm now REQUIRES 2FA on every token publish and no
    # longer offers the granular-token 2FA bypass, so a stored NPM_TOKEN cannot publish from
    # CI at all (4.107.1: E404 = the 90-day token expired, then E403 "Two-factor
    # authentication required" with a fresh one). npm instead trusts this workflow's GitHub
    # OIDC identity: each package on npmjs.com lists Trusted Publisher = GitHub Actions,
    # org Spitfire-Products, repo nexus-cortex, workflow publish.yml (no environment).
    # `id-token: write` lets npm mint the short-lived publish credential; no secret is used.
    permissions:
      contents: read
      id-token: write
    env:
      # executors -> playwright downloads browsers on install and OOM-crashes npm ci.
      # No browser tests here, so skip it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      # Pin EXACT node so its bundled npm is 10.8.2 — the runner's newer npm intermittently
      # aborts `npm ci` ("Exit handler never called!"), unlinking bins so the build falls
      # through to the runner's global tsc 6.x (TS5107). A `npm install -g npm@…` step does
      # not change the npm the next step runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
      # `npm ci` reify intermittently aborts on this runner with "Exit handler never
      # called!" then exits 0, leaving an INCOMPLETE install (bins not linked). Gate
      # fallbacks on whether tsc linked, NOT exit code; lead with --ignore-scripts (skips
      # the playwright/native postinstall that triggers the crash). Build is `tsc` only, and
      # publish-time `prepack` is unaffected by install-time --ignore-scripts.
      # Build is `tsc` only → --ignore-scripts (skips playwright/native postinstalls) is
      # sufficient; publish-time `prepack` is unaffected. The deploy script sanitizes the
      # lockfile's tarball URLs to the public registry (Replit's internal proxy host is
      # unreachable here). Assert the LOCAL tsc bin linked so the build uses tsc 5.9.3.
      - name: Install deps
        run: |
          node -v && npm -v
          npm ci --no-audit --no-fund --ignore-scripts \
            || { echo "retry"; rm -rf node_modules packages/*/node_modules; npm ci --no-audit --no-fund --ignore-scripts; }
          test -x node_modules/.bin/tsc || { echo "::error::tsc not linked after install"; exit 1; }
          echo "[ok] local tsc $(node_modules/.bin/tsc --version)"
      # Ordered two-pass build (scripts/build.sh) — breaks the core<->executors cycle.
      - run: npm run build
      # Trusted publishing needs npm >= 11.5.1; node 20.18.1 bundles 10.8.2, so the publish
      # calls go through `npx -y npm@11` (an explicit newer npm, leaving the install/build npm
      # untouched — see the pin note above). --provenance attaches the SLSA attestation npm
      # derives from the same OIDC identity.
      - name: Publish types -> core -> executors -> server -> cli -> tui -> meta (trusted publishing, no token)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          NPM11: npx -y npm@11
        run: |
          set -euo pipefail
          $NPM11 --version
          for pkg in types canon core executors server cli tui meta; do
            dir="packages/$pkg"
            if [ ! -d "$dir" ]; then
              echo "::notice::skip $pkg (not in this release)"
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already on the registry — skipping"
              continue
            fi
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::notice::[dry-run] would publish $name@$version"
              ( cd "$dir" && $NPM11 publish --access public --provenance --dry-run )
            else
              echo "::notice::publishing $name@$version"
              # 2026-09-18: the package published immediately after a successful one has been left STAGED four times in two days
              # (core after types ×3, executors after core ×1) — never the first. Pace the sequence: 45 s between publishes.
              if [ "${published_any:-0}" = 1 ]; then echo "::notice::pacing 45 s before $name (staged-publish guard)"; sleep 45; fi
              ( cd "$dir" && $NPM11 publish --access public --provenance )
              published_any=1
              # 2026-09-18: npm has answered "+ $name@$version" and then left the version STAGED (never promoted into the
              # registry document) three times in two days (executors 4.116.0, core+executors 4.117.1, core 4.118.0). A
              # staged version is unrecoverable from our side; the only fix is a bumped republish. Verify the registry
              # DOCUMENT (not the publish exit code) before moving on, so the job fails loudly instead of reporting success.
              enc=$(printf %s "$name" | sed 's#/#%2F#')
              landed=0
              for i in $(seq 1 16); do
                if curl -sfL -m 20 "https://registry.npmjs.org/$enc" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.exit(j.versions&&j.versions[process.argv[1]]?0:1)})' "$version"; then landed=1; break; fi
                sleep 15
              done
              if [ "$landed" != 1 ]; then
                echo "::error::$name@$version is NOT in the registry document 4 min after publish — npm left it STAGED. Bump every package and republish (see npm-token-90-day-expiry memory)."
                exit 1
              fi
              echo "::notice::$name@$version verified in the registry document"
            fi
          done
          echo "Done."
